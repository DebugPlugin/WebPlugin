<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-title-row">
        <div class="doofinder-logo">D<span class="oo">OO</span>FINDER</div>
        <h1><span>Plugin Explorer</span></h1>
        <button type="button" id="logout-btn" class="btn-secondary" style="margin-left: auto;">Logout</button>
      </div>
      <p class="subtitle">Choose a platform and debug</p>
    </div>

    <div class="platform-grid">
      <a class="platform-card" href="/prestashop.html">
        <div class="icon" style="background:#E5E5E5"><img src="https://w7.pngwing.com/pngs/257/142/png-transparent-prestashop-e-commerce-free-software-mango-miscellaneous-logo-bird-thumbnail.png" alt=""></div>
        <div class="name">PrestaShop</div>
      </a>
      <a class="platform-card" href="/magento.html">
        <div class="icon" style="background:#F26322"><img src="/icons/magento.svg" alt=""></div>
        <div class="name">Magento</div>
      </a>
      <a class="platform-card" href="/woocommerce.html">
        <div class="icon" style="background:#8B4513"><img src="/icons/woocommerce-brown.png" alt=""></div>
        <div class="name">WooCommerce</div>
      </a>
      <a class="platform-card" href="/shopware.html">
        <div class="icon" style="background:#189EFF"><img src="/icons/shopware.svg" alt=""></div>
        <div class="name">Shopware</div>
      </a>
      <a class="platform-card" href="/shopware5.html">
        <div class="icon" style="background:#0B4C8C"><img src="/icons/shopware.svg" alt=""></div>
        <div class="name">Shopware 5</div>
      </a>
      <a class="platform-card" href="/shoper.html">
        <div class="icon" style="background:#ffffff;border:2px solid #1477F2"><img src="https://support.doofinder.com/theme/images/plugins/shoper-blue.svg" alt=""></div>
        <div class="name">Shoper</div>
      </a>
      <a class="platform-card" href="/shopify.html">
        <div class="icon" style="background:#7AB55C"><img src="/icons/shopify.svg" alt=""></div>
        <div class="name">Shopify</div>
      </a>
      <a class="platform-card" href="/bigcommerce.html">
        <div class="icon" style="background:#121118"><img src="/icons/bigcommerce.svg" alt=""></div>
        <div class="name">BigCommerce</div>
      </a>
      <a class="platform-card" href="/others.html">
        <div class="icon" style="background:#4B5563"><img src="/icons/others.svg" alt=""></div>
        <div class="name">Others</div>
      </a>
    </div>

    <button class="section-toggle" id="mcp-overview-toggle" type="button" data-target="mcp-overview-body" style="margin-top: 24px;">
      <span>Shared with MCP — All Platforms</span>
      <span class="section-chevron">▼</span>
    </button>
    <div class="section-body" id="mcp-overview-body">
      <div class="card">
        <h2>Shared with MCP — All Platforms</h2>
        <p class="hint">What's currently available to Claude via MCP (version, last API call, screenshots, notes) for each platform.</p>
        <div id="mcp-overview"></div>
      </div>
    </div>
  </div>

  <script src="/mcp-overview.js"></script>
  <script>
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } finally {
        window.location.href = '/login';
      }
    });
  </script>
</body>
</html>
