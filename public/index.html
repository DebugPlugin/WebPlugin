<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doofinder Plugin Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-title-row">
        <div class="doofinder-logo">D<span class="oo">OO</span>FINDER</div>
        <h1><span>Plugin Explorer</span></h1>
      </div>
      <p class="subtitle">Choose a platform to browse plugin releases and chat about its code.</p>
    </div>

    <div class="platform-grid">
      <a class="platform-card" href="/prestashop.html">
        <div class="icon" style="background:#DF0067"><img src="/icons/prestashop.svg" alt=""></div>
        <div class="name">PrestaShop</div>
      </a>
      <a class="platform-card" href="/magento.html">
        <div class="icon" style="background:#F26322"><img src="/icons/magento.svg" alt=""></div>
        <div class="name">Magento</div>
      </a>
      <a class="platform-card" href="/woocommerce.html">
        <div class="icon" style="background:#96588A"><img src="/icons/woocommerce.svg" alt=""></div>
        <div class="name">WooCommerce</div>
      </a>
      <a class="platform-card" href="/shopware.html">
        <div class="icon" style="background:#189EFF"><img src="/icons/shopware.svg" alt=""></div>
        <div class="name">Shopware</div>
      </a>
      <a class="platform-card" href="/shopware5.html">
        <div class="icon" style="background:#0B4C8C"><img src="/icons/shopware.svg" alt=""></div>
        <div class="name">Shopware 5</div>
      </a>
      <a class="platform-card" href="/shoper.html">
        <div class="icon letter" style="background:#1477F2">SH</div>
        <div class="name">Shoper</div>
      </a>
      <a class="platform-card" href="/shopify.html">
        <div class="icon" style="background:#7AB55C"><img src="/icons/shopify.svg" alt=""></div>
        <div class="name">Shopify</div>
      </a>
      <a class="platform-card" href="/bigcommerce.html">
        <div class="icon" style="background:#121118"><img src="/icons/bigcommerce.svg" alt=""></div>
        <div class="name">BigCommerce</div>
      </a>
    </div>
  </div>
</body>
</html>
